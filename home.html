<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ethio Mock Exam</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   HOME PAGE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    margin: 0;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -1;
}

.circle {

    position: absolute;

    border-radius: 50%;

    filter: blur(5px);

    opacity: .35;
}

.circle1 {

    width: 330px;
    height: 330px;

    background: #756cff;

    top: -150px;
    right: -100px;
}

.circle2 {

    width: 280px;
    height: 280px;

    background: #ff77a9;

    bottom: -140px;
    left: -100px;
}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    background: var(--card);

    border-bottom:
        1px solid var(--border);

    position: sticky;

    top: 0;

    z-index: 10;
}

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    font-weight: bold;

    font-size: 17px;

    color: var(--text);
}

.logoIcon {

    width: 42px;
    height: 42px;

    border-radius: 14px;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #7168e8,
            #ff72a8
        );

    color: white;

    font-size: 20px;

    animation:
        float 3s infinite ease-in-out;
}

.headerRight {

    display: flex;

    align-items: center;

    gap: 9px;
}

.xp {

    padding: 9px 12px;

    border-radius: 12px;

    background: var(--accentSoft);

    color: var(--accent);

    font-size: 12px;

    font-weight: bold;
}

.settingsButton {

    width: 42px;
    height: 42px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background: var(--card);

    color: var(--text);

    font-size: 18px;

    cursor: pointer;

    transition: .25s;
}

.settingsButton:hover {

    transform:
        rotate(25deg);
}


/* =====================================================
   ABOUT US BUTTON
===================================================== */

.aboutButton {

    height: 42px;

    padding: 0 14px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background: var(--card);

    color: var(--text);

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.aboutButton:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--accent);

    color:
        var(--accent);
}


/* =====================================================
   AVATAR
===================================================== */

.avatar {

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 12px;

    background: var(--accent);

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   MAIN
===================================================== */

main {

    width:
        min(1100px, 92%);

    margin: auto;

    padding:
        35px 0 70px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    min-height: 270px;

    padding: 35px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            #8d84ff
        );

    color: white;

    display: flex;

    justify-content: space-between;

    align-items: center;

    overflow: hidden;

    animation:
        appear .7s ease;
}

.welcome small {

    opacity: .8;

    letter-spacing: 1px;
}

.welcome h1 {

    font-size: 40px;

    margin: 13px 0;
}

.welcome p {

    max-width: 520px;

    line-height: 1.6;

    opacity: .9;
}

.startButton {

    margin-top: 20px;

    border: none;

    border-radius: 13px;

    padding:
        13px 18px;

    background: white;

    color: var(--accent);

    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.startButton:hover {

    transform:
        translateY(-4px);
}


/* =====================================================
   MASCOT
===================================================== */

.mascot {

    width: 150px;
    height: 150px;

    border-radius: 45%;

    background:
        rgba(255,255,255,.18);

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 75px;

    animation:
        mascot 3s infinite ease-in-out;
}


/* =====================================================
   SECTION
===================================================== */

.sectionTitle {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin:
        35px 0 16px;
}

.sectionTitle h2 {

    font-size: 21px;

    color: var(--text);
}

.sectionTitle span {

    font-size: 12px;

    color: var(--muted);
}


/* =====================================================
   FEATURES
===================================================== */

.features {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;
}

.feature {

    min-height: 190px;

    padding: 23px;

    text-align: left;

    border:
        1px solid var(--border);

    border-radius: 23px;

    background: var(--card);

    color: var(--text);

    cursor: pointer;

    box-shadow: var(--shadow);

    transition: .25s;
}

.feature:hover {

    transform:
        translateY(-7px);

    border-color:
        var(--accent);
}

.featureIcon {

    width: 55px;
    height: 55px;

    border-radius: 17px;

    background:
        var(--accentSoft);

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 25px;

    margin-bottom: 20px;
}

.feature h3 {

    margin-bottom: 8px;
}

.feature p {

    color: var(--muted);

    font-size: 12px;

    line-height: 1.5;
}


/* =====================================================
   LOWER CARDS
===================================================== */

.lower {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    margin-top: 16px;
}

.card {

    padding: 25px;

    border:
        1px solid var(--border);

    border-radius: 23px;

    background: var(--card);

    box-shadow: var(--shadow);
}


/* =====================================================
   CLICKABLE CARDS
===================================================== */

.clickableCard {

    width: 100%;

    text-align: left;

    color: var(--text);

    cursor: pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.clickableCard:hover {

    transform:
        translateY(-6px);

    border-color:
        var(--accent);

    box-shadow:
        0 12px 30px
        rgba(80,70,180,.15);
}

.clickableCard:active {

    transform:
        scale(.98);
}

.card p {

    color: var(--muted);

    font-size: 12px;
}

.cardLink {

    display: block;

    margin-top: 18px;

    color: var(--accent);

    font-size: 12px;

    font-weight: bold;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {

    height: 9px;

    margin-top: 20px;

    background: var(--border);

    border-radius: 20px;

    overflow: hidden;
}

.progressFill {

    width: 65%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            #ff72a8
        );

    transition:
        width .5s ease;
}


/* =====================================================
   STREAK
===================================================== */

.streak {

    display: flex;

    align-items: center;

    gap: 15px;
}

.streakIcon {

    width: 55px;
    height: 55px;

    border-radius: 17px;

    background:
        var(--accentSoft);

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 25px;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}

@keyframes float {

    0%,100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-6px);
    }
}

@keyframes mascot {

    0%,100% {

        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {

        transform:
            translateY(-10px)
            rotate(2deg);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px) {

    .features {

        grid-template-columns:
            1fr 1fr;
    }
}

@media(max-width:600px) {

    header {

        padding:
            0 14px;
    }

    .xp {

        display: none;
    }

    .aboutButton {

        padding:
            0 9px;

        font-size: 11px;
    }

    main {

        width: 94%;
    }

    .welcome {

        padding: 25px;
    }

    .welcome h1 {

        font-size: 30px;
    }

    .mascot {

        display: none;
    }

    .features {

        grid-template-columns:
            1fr;
    }

    .lower {

        grid-template-columns:
            1fr;
    }
}


/* =====================================================
   ANIMATION OFF SETTING
===================================================== */

body.animations-off *,
body.animations-off *::before,
body.animations-off *::after {

    animation: none !important;

    transition: none !important;
}

</style>

</head>


<body>


<!-- =====================================================
     THEME.JS
===================================================== -->

<script src="theme.js"></script>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="circle circle1"></div>

    <div class="circle circle2"></div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">

        <div class="logoIcon">
            ✦
        </div>

        Ethio Mock Exam

    </div>


    <div class="headerRight">


        <div class="xp">

            ⭐

            <span id="xp">
                0
            </span>

            XP

        </div>


        <!-- ABOUT US -->

        <button
            class="aboutButton"
            onclick="goAboutUs()">

            About Us

        </button>


        <!-- SETTINGS -->

        <button
            class="settingsButton"
            onclick="goSettings()">

            ⚙️

        </button>


        <!-- PROFILE -->

        <button
            class="avatar"
            id="avatar"
            onclick="goProfile()">

            S

        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


<!-- =====================================================
     WELCOME
===================================================== -->

<section class="welcome">


    <div>

        <small>
            WELCOME BACK
        </small>


        <h1>

            Hi,

            <span id="username">
                Student
            </span>

            👋

        </h1>


        <p>

            Turn your notes into practice,
            challenge yourself, and make
            studying more exciting.

        </p>


        <button
            class="startButton"
            onclick="goExercise()">

            Start Learning →

        </button>

    </div>


    <div class="mascot">

        🐼

    </div>


</section>


<!-- =====================================================
     EXPLORE
===================================================== -->

<div class="sectionTitle">

    <h2>
        Explore
    </h2>

    <span>
        Choose your next activity
    </span>

</div>


<section class="features">


    <!-- MY NOTES -->

    <button
        class="feature"
        onclick="goUpload()">

        <div class="featureIcon">
            📄
        </div>

        <h3>
            My Notes
        </h3>

        <p>

            Upload a note, photo,
            document, or type your
            own notes.

        </p>

    </button>


    <!-- PRACTICE -->

    <button
        class="feature"
        onclick="goExercise()">

        <div class="featureIcon">
            🎯
        </div>

        <h3>
            Practice
        </h3>

        <p>

            Answer questions and
            improve your knowledge.

        </p>

    </button>


    <!-- QUICK LEARN -->

    <button
        class="feature"
        onclick="goShortNotes()">

        <div class="featureIcon">
            📚
        </div>

        <h3>
            Quick Learn
        </h3>

        <p>

            Review useful short notes
            whenever you want.

        </p>

    </button>


    <!-- FRIENDS -->

    <button
        class="feature"
        onclick="goFriends()">

        <div class="featureIcon">
            🎮
        </div>

        <h3>
            Study Together
        </h3>

        <p>

            Challenge your friends
            and learn together.

        </p>

    </button>


</section>


<!-- =====================================================
     DAILY GOAL + STREAK
===================================================== -->

<div class="lower">


    <!-- DAILY GOAL -->

    <button
        class="card clickableCard"
        onclick="goDailyGoal()">


        <h3>
            🎯 Daily Goal
        </h3>


        <p>
            6 of 10 questions completed
        </p>


        <div class="progress">

            <div
                class="progressFill">
            </div>

        </div>


        <span class="cardLink">

            View Daily Goal →

        </span>


    </button>


    <!-- STREAK -->

    <button
        class="card clickableCard"
        onclick="goStreak()">


        <div class="streak">


            <div class="streakIcon">

                🔥

            </div>


            <div>

                <h3>
                    3 Day Streak
                </h3>

                <p>
                    Keep learning every day!
                </p>

            </div>


        </div>


        <span class="cardLink">

            View Streak →

        </span>


    </button>


</div>


</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   USER NAME
===================================================== */

const name =
    localStorage.getItem(
        "ethioUserName"
    ) || "Student";


document.getElementById(
    "username"
).textContent =
    name;


/* =====================================================
   AVATAR
===================================================== */

document.getElementById(
    "avatar"
).textContent =
    name
        .charAt(0)
        .toUpperCase();


/* =====================================================
   XP
===================================================== */

document.getElementById(
    "xp"
).textContent =
    localStorage.getItem(
        "ethioXP"
    ) || "0";


/* =====================================================
   ABOUT US
===================================================== */

function goAboutUs() {

    window.location.href =
        "about.html";

}


/* =====================================================
   SETTINGS
===================================================== */

function goSettings() {

    window.location.href =
        "settings.html";

}


/* =====================================================
   PROFILE
===================================================== */

function goProfile() {

    window.location.href =
        "profile.html";

}


/* =====================================================
   UPLOAD
===================================================== */

function goUpload() {

    window.location.href =
        "upload.html";

}


/* =====================================================
   EXERCISE
===================================================== */

function goExercise() {

    window.location.href =
        "exercise.html";

}


/* =====================================================
   SHORT NOTES
===================================================== */

function goShortNotes() {

    window.location.href =
        "shortnotes.html";

}


/* =====================================================
   FRIENDS
===================================================== */

function goFriends() {

    window.location.href =
        "friends.html";

}


/* =====================================================
   DAILY GOAL
===================================================== */

function goDailyGoal() {

    window.location.href =
        "dailygoal.html";

}


/* =====================================================
   STREAK
===================================================== */

function goStreak() {

    window.location.href =
        "streak.html";

}

</script>


</body>

</html>
