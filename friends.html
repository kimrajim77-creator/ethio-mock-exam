<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Invite Friends | Ethio Mock Exam</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
}

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(55px);
    opacity: .25;
    animation: blobMove 9s infinite alternate ease-in-out;
}

.blob1 {
    width: 330px;
    height: 330px;
    background: #756cff;
    top: -140px;
    right: -100px;
}

.blob2 {
    width: 300px;
    height: 300px;
    background: #ff72a8;
    bottom: -140px;
    left: -110px;
}

.blob3 {
    width: 200px;
    height: 200px;
    background: #4ddcff;
    top: 42%;
    left: 45%;
}

@keyframes blobMove {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(35px,-25px) scale(1.12);
    }

}

/* =========================
   HEADER
========================= */

header {

    height: 70px;

    padding: 0 25px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: var(--card);

    border-bottom: 1px solid var(--border);

}

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    color: var(--text);

    font-weight: bold;

}

.logoIcon {

    width: 42px;

    height: 42px;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
    linear-gradient(
        135deg,
        #7168e8,
        #ff72a8
    );

    color: white;

    font-size: 20px;

    animation:
    logoFloat 3s infinite ease-in-out;

}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }

}

/* =========================
   MAIN
========================= */

main {

    width: min(800px,94%);

    margin: auto;

    padding: 35px 0 70px;

}

/* =========================
   CARD
========================= */

.card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 30px;

    padding: 30px;

    box-shadow: var(--shadow);

    text-align: center;

    animation: appear .7s ease;

}

@keyframes appear {

    from {

        opacity: 0;

        transform:
        translateY(25px)
        scale(.98);

    }

    to {

        opacity: 1;

        transform:
        translateY(0)
        scale(1);

    }

}

/* =========================
   MASCOT
========================= */

.mascot {

    width: 110px;

    height: 110px;

    margin: auto;

    border-radius: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: var(--accentSoft);

    font-size: 60px;

    animation:
    mascotFloat 3s infinite ease-in-out;

}

@keyframes mascotFloat {

    0%,100% {

        transform:
        translateY(0)
        rotate(-2deg);

    }

    50% {

        transform:
        translateY(-8px)
        rotate(2deg);

    }

}

/* =========================
   TITLE
========================= */

h1 {

    color: var(--text);

    font-size: 30px;

    margin: 20px 0 8px;

}

.description {

    color: var(--muted);

    font-size: 13px;

    line-height: 1.7;

    max-width: 550px;

    margin: auto;

}

/* =========================
   ROOM CODE
========================= */

.roomBox {

    margin-top: 25px;

    padding: 18px;

    border-radius: 18px;

    background: var(--accentSoft);

}

.roomLabel {

    color: var(--muted);

    font-size: 11px;

}

.roomCode {

    color: var(--accent);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-top: 6px;

}

/* =========================
   LINK BOX
========================= */

.linkBox {

    display: flex;

    gap: 8px;

    margin-top: 15px;

}

.linkInput {

    flex: 1;

    min-width: 0;

    padding: 12px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: var(--card);

    color: var(--text);

    outline: none;

    font-size: 11px;

}

.copyButton {

    border: none;

    border-radius: 12px;

    padding: 0 16px;

    background: var(--accent);

    color: white;

    font-weight: bold;

    cursor: pointer;

}

.copyButton:hover {

    transform: translateY(-2px);

}

/* =========================
   SHARE TITLE
========================= */

.shareTitle {

    color: var(--text);

    font-size: 17px;

    font-weight: bold;

    margin: 30px 0 15px;

}

/* =========================
   SHARE BUTTONS
========================= */

.shareGrid {

    display: grid;

    grid-template-columns:
    repeat(5,1fr);

    gap: 10px;

}

.shareButton {

    border: 1px solid var(--border);

    border-radius: 17px;

    padding: 14px 7px;

    background: var(--card);

    color: var(--text);

    cursor: pointer;

    transition: .25s;

    font-size: 10px;

    font-weight: bold;

}

.shareButton:hover {

    transform: translateY(-5px);

    border-color: var(--accent);

}

.shareIcon {

    display: block;

    font-size: 27px;

    margin-bottom: 6px;

}

/* =========================
   SOCIAL BUTTON COLORS
========================= */

.telegram:hover {
    background: #229ED9;
    color: white;
}

.whatsapp:hover {
    background: #25D366;
    color: white;
}

.instagram:hover {
    background: #E1306C;
    color: white;
}

.facebook:hover {
    background: #1877F2;
    color: white;
}

.copy:hover {
    background: var(--accent);
    color: white;
}

/* =========================
   STATUS
========================= */

.status {

    min-height: 25px;

    margin-top: 17px;

    color: var(--muted);

    font-size: 11px;

}

/* =========================
   CONTINUE
========================= */

.continueButton {

    width: 100%;

    margin-top: 15px;

    padding: 15px;

    border: none;

    border-radius: 15px;

    background:
    linear-gradient(
        135deg,
        var(--accent),
        #ff72a8
    );

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

}

.continueButton:hover {

    transform: translateY(-3px);

    box-shadow:
    0 12px 25px
    rgba(113,104,232,.25);

}

/* =========================
   MOBILE
========================= */

@media(max-width:650px) {

    header {
        padding: 0 14px;
    }

    main {
        padding-top: 25px;
    }

    .card {
        padding: 23px 15px;
    }

    h1 {
        font-size: 25px;
    }

    .shareGrid {

        grid-template-columns:
        repeat(2,1fr);

    }

    .shareButton:last-child {

        grid-column:
        span 2;

    }

    .linkBox {

        flex-direction: column;

    }

    .copyButton {

        padding: 12px;

    }

}

/* =========================
   ANIMATION SETTING
========================= */

body.animations-off *,
body.animations-off *::before,
body.animations-off *::after {

    animation: none !important;

    transition: none !important;

}

</style>

</head>

<body>

<script src="theme.js"></script>

<div class="background">

    <div class="blob blob1"></div>

    <div class="blob blob2"></div>

    <div class="blob blob3"></div>

</div>

<header>

    <div class="logo">

        <div class="logoIcon">
            ✦
        </div>

        Ethio Mock Exam

    </div>

</header>

<main>

<section class="card">

    <div class="mascot">
        🐼
    </div>

    <h1>
        Invite Your Friend 🚀
    </h1>

    <p class="description">

        Create a study room and invite
        your friend to study together
        or compete in an exciting
        mock exam challenge.

    </p>

    <div class="roomBox">

        <div class="roomLabel">
            YOUR INVITATION CODE
        </div>

        <div
            class="roomCode"
            id="roomCode">

            Loading...

        </div>

    </div>

    <div class="linkBox">

        <input
            class="linkInput"
            id="inviteLink"
            readonly
        >

        <button
            class="copyButton"
            onclick="copyLink()">

            📋 Copy

        </button>

    </div>

    <div class="shareTitle">

        Share invitation with

    </div>

    <div class="shareGrid">

        <button
            class="shareButton telegram"
            onclick="shareTelegram()">

            <span class="shareIcon">
                ✈️
            </span>

            Telegram

        </button>

        <button
            class="shareButton whatsapp"
            onclick="shareWhatsApp()">

            <span class="shareIcon">
                💬
            </span>

            WhatsApp

        </button>

        <button
            class="shareButton instagram"
            onclick="shareInstagram()">

            <span class="shareIcon">
                📸
            </span>

            Instagram

        </button>

        <button
            class="shareButton facebook"
            onclick="shareFacebook()">

            <span class="shareIcon">
                f
            </span>

            Facebook

        </button>

        <button
            class="shareButton copy"
            onclick="copyLink()">

            <span class="shareIcon">
                🔗
            </span>

            Copy Link

        </button>

    </div>

    <div
        class="status"
        id="status">

    </div>

    <button
        class="continueButton"
        onclick="goToWaitingRoom()">

        🚀 Continue to Room

    </button>

</section>

</main>

<script>

/* =====================================================
   INVITATION CODE
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let roomCode =
    params.get("code");

if (!roomCode) {

    roomCode =
        localStorage.getItem(
            "ethioRoomCode"
        );

}

if (!roomCode) {

    roomCode =
        "ETH-" +
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

}


/* =====================================================
   SAVE CODE
===================================================== */

localStorage.setItem(
    "ethioRoomCode",
    roomCode
);


/* =====================================================
   SHOW CODE
===================================================== */

document.getElementById(
    "roomCode"
).textContent =
    roomCode;


/* =====================================================
   INVITATION LINK
   FIXED FOR /pages/join.html
===================================================== */

const inviteLink =
    window.location.origin +
    "/pages/join.html?code=" +
    encodeURIComponent(roomCode);


/* =====================================================
   SHOW LINK
===================================================== */

document.getElementById(
    "inviteLink"
).value =
    inviteLink;


/* =====================================================
   MESSAGE
===================================================== */

const message =
    "🚀 Join me on Ethio Mock Exam!\n\n" +
    "📚 Let's study together or compete!\n\n" +
    inviteLink;


/* =====================================================
   STATUS
===================================================== */

function showStatus(text) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


/* =====================================================
   COPY LINK
===================================================== */

async function copyLink() {

    try {

        await navigator.clipboard.writeText(
            inviteLink
        );

        showStatus(
            "✅ Invitation link copied!"
        );

    }

    catch(error) {

        const input =
            document.getElementById(
                "inviteLink"
            );

        input.select();

        document.execCommand(
            "copy"
        );

        showStatus(
            "✅ Invitation link copied!"
        );

    }

}


/* =====================================================
   TELEGRAM
===================================================== */

function shareTelegram() {

    const telegramURL =
        "https://t.me/share/url?url=" +
        encodeURIComponent(inviteLink) +
        "&text=" +
        encodeURIComponent(
            "🚀 Join me on Ethio Mock Exam!\n\n" +
            "📚 Let's study together or compete!"
        );

    window.location.href =
        telegramURL;

}


/* =====================================================
   WHATSAPP
===================================================== */

function shareWhatsApp() {

    const whatsappURL =
        "https://wa.me/?text=" +
        encodeURIComponent(message);

    window.location.href =
        whatsappURL;

}


/* =====================================================
   FACEBOOK
===================================================== */

function shareFacebook() {

    const facebookURL =
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(inviteLink);

    window.location.href =
        facebookURL;

}


/* =====================================================
   INSTAGRAM
===================================================== */

function shareInstagram() {

    copyLink();

    setTimeout(
        function() {

            window.location.href =
                "https://www.instagram.com/";

        },
        700
    );

}


/* =====================================================
   CONTINUE
===================================================== */

function goToWaitingRoom() {

    localStorage.setItem(
        "friendRoomCode",
        roomCode
    );

    window.location.href =
        "waitingroom.html?code=" +
        encodeURIComponent(roomCode);

}

</script>

</body>

</html>
