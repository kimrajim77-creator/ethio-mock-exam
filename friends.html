<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Friends | Ethio Mock Exam</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      transition: background 0.4s, color 0.4s;
    }

    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-blobs span {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: #7b8cff;
      top: -120px;
      right: -80px;
    }
    .blob-2 {
      width: 340px;
      height: 340px;
      background: #f26b8a;
      bottom: -100px;
      left: -60px;
    }
    body.dark .blob-1 { background: #5b6ee0; opacity: 0.2; }
    body.dark .blob-2 { background: #c75a7a; opacity: 0.2; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 80px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(128, 140, 180, 0.12);
      position: sticky;
      top: 0;
      z-index: 30;
      transition: background 0.3s;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
    }
    .logo img {
      height: 45px;
      width: auto;
      border-radius: 10px;
      object-fit: contain;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .logo-text .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-text .sub {
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .theme-toggle, .back-btn {
      background: var(--card);
      border: 1px solid rgba(128, 140, 180, 0.15);
      border-radius: 14px;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      color: var(--text);
      cursor: pointer;
      transition: 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover, .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--primary);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(128, 140, 180, 0.12);
      border-radius: 28px;
      padding: 35px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .mascot {
      font-size: 4.5rem;
      margin-bottom: 16px;
      display: block;
    }

    .card h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .card .description {
      color: var(--muted);
      line-height: 1.7;
      max-width: 550px;
      margin: 0 auto 25px;
    }

    .room-box {
      background: var(--accentSoft);
      border-radius: 18px;
      padding: 20px;
      margin: 20px 0;
    }
    .room-box .label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .room-box .code {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 3px;
      margin-top: 6px;
    }

    .link-box {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
    .link-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(128, 140, 180, 0.2);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }
    .link-box button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }
    .link-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 91, 217, 0.2);
    }

    .share-title {
      font-weight: 600;
      margin: 25px 0 15px;
      font-size: 1.1rem;
    }

    .share-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .share-btn {
      border: 1px solid rgba(128, 140, 180, 0.12);
      border-radius: 16px;
      padding: 16px 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: 0.25s;
      font-weight: 500;
      font-size: 0.8rem;
    }
    .share-btn:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .share-btn .icon {
      display: block;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .telegram:hover { background: #229ED9; color: white; border-color: #229ED9; }
    .whatsapp:hover { background: #25D366; color: white; border-color: #25D366; }
    .instagram:hover { background: #E1306C; color: white; border-color: #E1306C; }
    .facebook:hover { background: #1877F2; color: white; border-color: #1877F2; }

    .status {
      min-height: 30px;
      color: var(--muted);
      font-size: 0.85rem;
      margin: 15px 0;
    }

    .continue-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 15px;
    }
    .continue-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(74, 91, 217, 0.25);
    }

    @media (max-width: 600px) {
      .share-grid { grid-template-columns: repeat(2, 1fr); }
      .share-btn:last-child { grid-column: span 2; }
      .link-box { flex-direction: column; }
      header { padding: 0 16px; }
      .logo img { height: 36px; }
      .logo-text .brand { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <span class="blob-1"></span>
    <span class="blob-2"></span>
  </div>

  <header>
    <a href="home.html" class="logo">
      <img src="ethio-mock-exam-logo.png" alt="Ethio Mock Exam Logo">
      <div class="logo-text">
        <span class="brand">Ethio Mock Exam</span>
        <span class="sub">Learn · Practice · Succeed</span>
      </div>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
      <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-home"></i></button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <span class="mascot">🐼</span>
      <h1>Invite Your Friend 🚀</h1>
      <p class="description">Create a study room and invite your friend to study together or compete in an exciting mock exam challenge.</p>

      <div class="room-box">
        <div class="label">YOUR INVITATION CODE</div>
        <div class="code" id="roomCode">Loading...</div>
      </div>

      <div class="link-box">
        <input type="text" id="inviteLink" readonly>
        <button onclick="copyLink()">📋 Copy</button>
      </div>

      <div class="share-title">Share invitation with</div>
      <div class="share-grid">
        <button class="share-btn telegram" onclick="shareTelegram()"><span class="icon">✈️</span>Telegram</button>
        <button class="share-btn whatsapp" onclick="shareWhatsApp()"><span class="icon">💬</span>WhatsApp</button>
        <button class="share-btn instagram" onclick="shareInstagram()"><span class="icon">📸</span>Instagram</button>
        <button class="share-btn facebook" onclick="shareFacebook()"><span class="icon">f</span>Facebook</button>
        <button class="share-btn" onclick="copyLink()"><span class="icon">🔗</span>Copy Link</button>
      </div>

      <div class="status" id="status"></div>
      <button class="continue-btn" onclick="goToWaitingRoom()">🚀 Continue to Room</button>
    </div>
  </div>

  <script>
    (function() {
      const themeToggle = document.getElementById('themeToggle');

      function setTheme(theme) {
        document.body.classList.remove('dark');
        if (theme === 'dark') document.body.classList.add('dark');
        else if (theme === 'system') {
          const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefers) document.body.classList.add('dark');
        }
        localStorage.setItem('ethioTheme', theme);
        updateThemeIcon();
      }

      function getStoredTheme() {
        return localStorage.getItem('ethioTheme') || 'light';
      }

      function updateThemeIcon() {
        const isDark = document.body.classList.contains('dark');
        themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      }

      const initialTheme = getStoredTheme();
      setTheme(initialTheme);

      themeToggle.addEventListener('click', () => {
        const current = getStoredTheme();
        const next = current === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });

      const WEBSITE_URL = 'https://kimrajim77-creator.github.io/ethio-mock-exam';
      const params = new URLSearchParams(window.location.search);
      let roomCode = params.get('code') || localStorage.getItem('ethioRoomCode') || 'ETH-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      localStorage.setItem('ethioRoomCode', roomCode);

      document.getElementById('roomCode').textContent = roomCode;
      const inviteLink = WEBSITE_URL + '/join.html?code=' + encodeURIComponent(roomCode);
      document.getElementById('inviteLink').value = inviteLink;

      const message = '🚀 Join me on Ethio Mock Exam!\n\n📚 Let\'s study together or compete!\n\n' + inviteLink;

      function showStatus(text) {
        document.getElementById('status').textContent = text;
      }

      window.copyLink = async function() {
        try {
          await navigator.clipboard.writeText(inviteLink);
          showStatus('✅ Invitation link copied!');
        } catch(e) {
          document.getElementById('inviteLink').select();
          document.execCommand('copy');
          showStatus('✅ Invitation link copied!');
        }
      };

      window.shareTelegram = function() {
        window.location.href = 'https://t.me/share/url?url=' + encodeURIComponent(inviteLink) + '&text=' + encodeURIComponent('🚀 Join me on Ethio Mock Exam!\n\n📚 Let\'s study together or compete!');
      };

      window.shareWhatsApp = function() {
        window.location.href = 'https://wa.me/?text=' + encodeURIComponent(message);
      };

      window.shareFacebook = function() {
        window.location.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(inviteLink);
      };

      window.shareInstagram = function() {
        copyLink();
        setTimeout(() => { window.location.href = 'https://www.instagram.com/'; }, 700);
      };

      window.goToWaitingRoom = function() {
        localStorage.setItem('friendRoomCode', roomCode);
        window.location.href = WEBSITE_URL + '/waitingroom.html?code=' + encodeURIComponent(roomCode);
      };
    })();
  </script>
</body>
</html>
